name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # 監聽 main 分支的推播

permissions:
  contents: read      # 允許讀取你的程式碼
  pages: write        # 允許部署到 GitHub Pages
  id-token: write     # 允許進行安全認證 (解決報錯的關鍵)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Inject Firebase API Key
      #   run: |
      #     # 1. 執行替換指令 (請確認這裡的路徑正確)
      #     sed -i 's/FIREBASE_API_KEY_PLACEHOLDER/${{ secrets.FIREBASE_API_KEY }}/g' index.html
          
      #     # 2. 除錯檢查：看看檔案裡還有沒有佔位符
      #     if grep -q "FIREBASE_API_KEY_PLACEHOLDER" index.html; then
      #       echo "❌ 錯誤：替換失敗！佔位符依然存在。請檢查路徑或檔案內容是否吻合。"
      #       exit 1 # 強制讓這個 Action 標示為失敗 (紅色叉叉)
      #     else
      #       echo "✅ 成功：佔位符已消失！"
      #     fi

      # 刪除原本的 Inject Firebase API Key 步驟，換成這個：
      - name: Generate Firebase Config for Production
        run: |
          cat << EOF > firebase-env.js
          export const firebaseConfig = {
            apiKey: "${{ secrets.FIREBASE_API_KEY }}",
            authDomain: "ptcg-quiz-test.firebaseapp.com",
            projectId: "ptcg-quiz-test",
            storageBucket: "ptcg-quiz-test.firebasestorage.app",
            messagingSenderId: "151102927798",
            appId: "1:151102927798:web:7262d98845b866d10f0717",
            measurementId: "G-T1F7SB2JX3"
          };
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4