name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # 監聽 main 分支的推播

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Firebase API Key
        run: |
          # 1. 執行替換指令 (請確認這裡的路徑正確)
          sed -i 's/FIREBASE_API_KEY_PLACEHOLDER/${{ secrets.FIREBASE_API_KEY }}/g' index.html
          
          # 2. 除錯檢查：看看檔案裡還有沒有佔位符
          if grep -q "FIREBASE_API_KEY_PLACEHOLDER" index.html; then
            echo "❌ 錯誤：替換失敗！佔位符依然存在。請檢查路徑或檔案內容是否吻合。"
            exit 1 # 強制讓這個 Action 標示為失敗 (紅色叉叉)
          else
            echo "✅ 成功：佔位符已消失！"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4