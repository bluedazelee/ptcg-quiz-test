<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTCG 線上測驗系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-input:checked + .option-content {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 1px #3b82f6;
        }

        .loader {
            border-top-color: #3b82f6;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .slide-in-right {
            animation: slideInRight 0.22s ease-out;
        }
        .slide-in-left {
            animation: slideInLeft 0.22s ease-out;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(24px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-24px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        body.quiz-active {
            height: 100vh;
            height: 100dvh;
            min-height: 0;
            overflow: hidden;
        }
        body.quiz-active main {
            padding: 0 !important;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">PTCG 測驗</h1>
            </div>
            <div id="quiz-progress-text" class="hidden text-sm font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-full border border-blue-100">
                第 <span id="current-q-num">1</span> 題 / 共 <span id="total-q-num">0</span> 題
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center p-4 sm:p-8 w-full max-w-4xl mx-auto">
        
        <!-- View: Loading -->
        <div id="view-loading" class="w-full bg-white rounded-3xl shadow-xl p-12 text-center flex flex-col items-center justify-center mt-10 border border-slate-100">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-14 w-14 mb-6"></div>
            <h2 class="text-xl font-bold text-slate-800">正在同步雲端資料...</h2>
            <p class="text-slate-500 mt-2">請稍候，系統正在準備題庫與排行榜</p>
        </div>

        <!-- View: Error -->
        <div id="view-error" class="hidden w-full bg-red-50 border-2 border-red-100 rounded-3xl p-12 text-center mt-10">
            <div class="bg-red-100 text-red-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-red-800 mb-2">發生連線錯誤</h2>
            <p id="error-message" class="text-red-700 font-medium mb-8">無法載入資料，請確認網路連線或 Firebase 設定。</p>
            <button onclick="location.reload()" class="px-8 py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95">重新整理</button>
        </div>

        <!-- View: Start -->
        <div id="view-start" class="hidden w-full bg-white rounded-3xl shadow-2xl p-10 text-center mt-6 fade-in border border-slate-100">
            <h2 class="text-3xl font-extrabold text-slate-900 mb-2">準備好接受挑戰了嗎？</h2>
            <p class="text-slate-500 mb-10 text-lg">題庫包含 <span id="start-total-q" class="font-bold text-blue-600">0</span> 道題目。</p>
            
            <div class="mb-8 max-w-sm mx-auto">
                <label for="nickname-input" class="block text-sm font-bold text-slate-700 mb-3 text-left pl-1">暱稱（選填）</label>
                <input type="text" id="nickname-input" maxlength="10" placeholder="輸入暱稱 (最多 10 字)"
                    class="w-full px-5 py-4 border-2 border-slate-200 rounded-2xl focus:border-blue-500 focus:ring-4 focus:ring-blue-50/50 outline-none transition-all text-center text-xl font-bold placeholder-slate-300">
            </div>

            <div class="mb-8 max-w-sm mx-auto">
                <p class="text-sm font-bold text-slate-700 mb-3 text-left pl-1">選擇題庫</p>
                <div class="flex gap-3">
                    <button id="bank-btn-A" onclick="selectBank('A')" class="flex-1 py-4 px-3 rounded-2xl border-2 border-blue-500 bg-blue-50 text-blue-700 font-bold text-sm transition-all active:scale-95">
                        <div class="text-base font-black mb-1">招式效果順序</div>
                        <div class="text-xs font-bold text-blue-400">共 <span id="count-A">0</span> 題</div>
                    </button>
                    <button id="bank-btn-B" onclick="selectBank('B')" class="flex-1 py-4 px-3 rounded-2xl border-2 border-slate-200 text-slate-600 font-bold text-sm transition-all active:scale-95 hover:border-slate-300">
                        <div class="text-base font-black mb-1">「消除」效果</div>
                        <div class="text-xs font-bold text-slate-400">共 <span id="count-B">0</span> 題</div>
                    </button>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-4">
                <button onclick="startQuiz()" class="group relative w-full sm:w-auto px-12 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold text-lg rounded-2xl shadow-xl shadow-blue-200 transition-all active:scale-95 flex items-center justify-center gap-3">
                    開始測驗
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>
                <button onclick="openLeaderboard()" class="w-full sm:w-auto px-10 py-4 bg-white border-2 border-amber-200 hover:bg-amber-50 text-amber-600 font-bold text-lg rounded-2xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                    </svg>
                    排行榜
                </button>
            </div>
            <div class="mt-4 flex justify-center">
                <button onclick="openResultLookup()" class="px-8 py-3 bg-white border-2 border-slate-200 hover:bg-slate-50 text-slate-500 font-bold rounded-2xl shadow-sm transition-all active:scale-95 flex items-center gap-2 text-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    用代碼查詢答題結果
                </button>
            </div>
        </div>

        <!-- View: Quiz -->
        <div id="view-quiz" class="hidden w-full flex-1 flex flex-col overflow-hidden">
            <!-- 進度條 (flex-none) -->
            <div class="flex-none px-4 pt-3 pb-2 bg-white border-b border-slate-100">
                <div class="max-w-3xl mx-auto w-full bg-slate-200 rounded-full h-2 overflow-hidden shadow-inner">
                    <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-indigo-600 h-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- 題目內容區 (flex-1，可獨立捲動) -->
            <div id="q-content-scroll" class="flex-1 overflow-y-auto">
                <div id="q-content-inner" class="max-w-3xl mx-auto px-4 sm:px-8 py-5">
                    <div class="mb-4 flex justify-between items-center">
                        <span id="q-type-badge" class="px-4 py-1.5 text-xs font-bold uppercase tracking-widest rounded-full bg-blue-100 text-blue-700">單選題</span>
                        <span id="q-accuracy-badge" class="hidden"></span>
                    </div>

                    <h3 id="q-title" class="text-xl sm:text-2xl font-bold text-slate-900 mb-5 leading-snug">...</h3>

                    <!-- 題目卡圖區域：單圖或多圖橫向捲動，由 renderQuestion() 動態注入 -->
                    <div id="q-image-container" class="mb-6 hidden"></div>

                    <div id="q-options" class="grid grid-cols-1 gap-3">
                        <!-- Options injected here -->
                    </div>
                </div>
            </div>

            <!-- 導覽列 (flex-none，永遠固定於視窗底部) -->
            <div class="flex-none bg-white border-t border-slate-200 shadow-[0_-2px_8px_rgba(0,0,0,0.06)]">
                <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
                    <button onclick="prevQuestion()" id="btn-prev" class="px-5 py-2.5 text-slate-600 font-bold bg-white border border-slate-300 hover:bg-slate-50 rounded-xl transition-all disabled:opacity-30 disabled:cursor-not-allowed text-sm">
                        上一題
                    </button>
                    <button onclick="nextQuestion()" id="btn-next" class="px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50 text-sm">
                        下一題
                    </button>
                </div>
            </div>
        </div>

        <!-- View: Result -->
        <div id="view-result" class="hidden w-full fade-in pb-20">
            <div class="bg-white rounded-3xl shadow-2xl p-10 text-center mb-10 mt-6 border border-slate-100">
                <h2 class="text-3xl font-black text-slate-900 mb-2">測驗結算</h2>
                <p class="text-slate-600 mb-8 text-lg font-medium">玩家：<span id="display-nickname" class="text-blue-600 font-black border-b-4 border-blue-100">挑戰者</span></p>
                
                <div class="relative inline-flex items-center justify-center mb-10">
                    <svg class="w-48 h-48 transform -rotate-90">
                        <circle cx="96" cy="96" r="80" stroke="currentColor" stroke-width="12" fill="transparent" class="text-slate-100" />
                        <circle cx="96" cy="96" r="80" stroke="currentColor" stroke-width="12" fill="transparent" stroke-dasharray="502.65" id="score-circle" class="text-blue-600 transition-all duration-1000 ease-out" />
                    </svg>
                    <div class="absolute inset-0 flex flex-col items-center justify-center">
                        <span class="text-6xl font-black text-slate-900" id="result-score">0</span>
                        <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">分</span>
                    </div>
                </div>
                
                <div class="flex justify-center gap-12 mb-10">
                    <div>
                        <div class="text-3xl font-black text-green-500" id="result-correct">0</div>
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">答對</div>
                    </div>
                    <div class="w-px bg-slate-200"></div>
                    <div>
                        <div class="text-3xl font-black text-red-500" id="result-wrong">0</div>
                        <div class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">答錯</div>
                    </div>
                </div>

                <!-- 答題代碼卡片 -->
                <div id="result-code-card" class="mx-auto max-w-sm mb-8 p-5 bg-slate-50 border-2 border-slate-200 rounded-2xl text-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">答題代碼</p>
                    <div class="flex justify-center gap-2 mb-4" id="result-code-display">
                        <div class="animate-pulse h-10 w-full bg-slate-200 rounded-xl"></div>
                    </div>
                    <button id="btn-copy-code" onclick="copyResultCode()" class="w-full py-2.5 bg-slate-800 hover:bg-black text-white text-sm font-bold rounded-xl transition-all active:scale-95">
                        複製代碼
                    </button>
                </div>

                <div class="flex flex-col sm:flex-row justify-center gap-4">
                    <button onclick="restartApp()" class="px-10 py-4 bg-slate-900 hover:bg-black text-white font-bold rounded-2xl shadow-xl transition-all active:scale-95">
                        再次挑戰
                    </button>
                    <button onclick="openLeaderboard()" class="px-10 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                        查看排名
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-4 mb-6">
                <div class="h-1 bg-blue-600 w-12 rounded-full"></div>
                <h3 class="text-2xl font-black text-slate-900">答題詳解</h3>
            </div>
            <div id="review-container" class="flex flex-col gap-6">
                <!-- Review cards here -->
            </div>
        </div>

        <!-- Leaderboard Modal -->
        <div id="leaderboard-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 hidden opacity-0 transition-opacity duration-300 p-4 backdrop-blur-sm">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden transform scale-90 transition-transform duration-300 flex flex-col max-h-[90vh]" id="leaderboard-card">
                <div class="bg-gradient-to-br from-amber-400 to-orange-500 p-6 text-white text-center relative">
                    <button onclick="closeLeaderboard()" class="absolute top-4 right-4 bg-black/10 hover:bg-black/20 p-2 rounded-full transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                    <div class="bg-white/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
                        </svg>
                    </div>
                    <h3 class="text-2xl font-black italic uppercase tracking-tighter">Ranking</h3>
                    <p class="text-amber-50 text-sm font-bold opacity-80 uppercase tracking-widest">排行榜</p>
                </div>
                
                <!-- 題庫篩選 tabs -->
                <div id="lb-filter-tabs" class="flex border-b border-slate-200 bg-white">
                    <button id="tab-all" onclick="setLeaderboardFilter('all')" class="flex-1 py-2.5 text-xs font-bold transition-colors text-blue-600 border-b-2 border-blue-600">全部</button>
                    <button id="tab-A" onclick="setLeaderboardFilter('A')" class="flex-1 py-2.5 text-xs font-bold transition-colors text-slate-400 border-b-2 border-transparent hover:text-slate-600">招式效果順序</button>
                    <button id="tab-B" onclick="setLeaderboardFilter('B')" class="flex-1 py-2.5 text-xs font-bold transition-colors text-slate-400 border-b-2 border-transparent hover:text-slate-600">「消除」效果</button>
                </div>

                <!-- 本次成績區塊 (預設隱藏) -->
                <div id="current-score-banner" class="hidden bg-blue-50 border-b border-blue-100 p-4">
                    <p class="text-xs text-blue-500 font-bold uppercase tracking-widest mb-1 text-center">本次測驗成績</p>
                    <div class="flex items-center justify-center gap-4">
                        <div class="text-center">
                            <span class="text-2xl font-black text-blue-700" id="banner-score">0</span>
                            <span class="text-xs font-bold text-blue-400 uppercase">PTS</span>
                        </div>
                        <div class="w-px h-8 bg-blue-200"></div>
                        <div class="text-center">
                            <span class="text-2xl font-black text-slate-700" id="banner-rank">-</span>
                            <span class="text-xs font-bold text-slate-400 uppercase">Rank</span>
                        </div>
                    </div>
                </div>

                <div class="flex-grow overflow-y-auto p-6 bg-slate-50 no-scrollbar min-h-[300px]" id="leaderboard-list">
                    <!-- Leaderboard entries -->
                    <div class="animate-pulse flex flex-col gap-4">
                        <div class="h-14 bg-slate-200 rounded-2xl w-full"></div>
                        <div class="h-14 bg-slate-200 rounded-2xl w-full"></div>
                        <div class="h-14 bg-slate-200 rounded-2xl w-full"></div>
                    </div>
                </div>

                <!-- 頁尾與分頁控制 -->
                <div class="p-4 border-t border-slate-100 bg-white">
                    <!-- 分頁按鈕 -->
                    <div class="flex items-center justify-between mb-4 px-4">
                        <button onclick="prevPage()" id="btn-prev-page" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <span id="page-info" class="text-sm font-bold text-slate-500 tracking-widest">1 / 1</span>
                        <button onclick="nextPage()" id="btn-next-page" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                    <button onclick="closeLeaderboard()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-black rounded-2xl transition-all active:scale-95">
                        返回
                    </button>
                </div>
            </div>
        </div>

        <!-- View: Lookup -->
        <div id="view-lookup" class="hidden w-full fade-in pb-20">
            <div class="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-3xl p-6 text-white text-center mt-6 mb-6 shadow-2xl">
                <div class="bg-white/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                </div>
                <h2 class="text-2xl font-black tracking-tight">查詢答題結果</h2>
                <p class="text-blue-100 text-sm font-bold opacity-80 mt-1">輸入代碼查看詳細答題明細</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mb-6">
                <div class="flex flex-wrap gap-3">
                    <input id="lookup-code-input" type="text" maxlength="6" placeholder="輸入 6 位代碼" autocomplete="off"
                        class="flex-1 min-w-[10rem] px-4 py-3 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-50 outline-none transition-all text-center text-xl font-black tracking-wider uppercase font-mono placeholder:text-slate-300 placeholder:font-normal placeholder:tracking-normal">

            </div>

    </main>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, onSnapshot, doc, setDoc, getDoc, runTransaction, increment, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // Firebase Configuration
        // const firebaseConfig = {
        //     apiKey: "FIREBASE_API_KEY_PLACEHOLDER",
        //     authDomain: "ptcg-quiz-test.firebaseapp.com",
        //     projectId: "ptcg-quiz-test",
        //     storageBucket: "ptcg-quiz-test.firebasestorage.app",
        //     messagingSenderId: "151102927798",
        //     appId: "1:151102927798:web:7262d98845b866d10f0717",
        //     measurementId: "G-T1F7SB2JX3"
        // };
        
        import { firebaseConfig } from "./firebase-env.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // App State
        const state = {
            questions: [],
            currentIdx: 0,
            userAnswers: {},
            nickname: '挑戰者',
            fullSortedData: [],
            isAuthReady: false,
            lastScore: null,
            lastTime: null,
            currentPage: 1,
            itemsPerPage: 3,
            currentQuizBank: 'A',
            questionsA: [],
            questionsB: [],
            leaderboardFilter: 'all',
            lastQuizBank: null,
            lastResultCode: null,
            questionMap: {},
            questionStats: {}
        };

        const views = {
            loading: document.getElementById('view-loading'),
            error: document.getElementById('view-error'),
            start: document.getElementById('view-start'),
            quiz: document.getElementById('view-quiz'),
            result: document.getElementById('view-result'),
            lookup: document.getElementById('view-lookup')
        };

        const CSV_URL_A = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQJct_Ip13Rzm3V9uqEywbABfRTpfkM_vvSb9DPOo-xKEZV59DkHWTQIGSEtTwI0_I_7IIF0IRDGE9U/pub?output=csv";
        const CSV_URL_B = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQpCeDJrbYAShATFp_ltvepaVxD94f3FOx_Yj-nj_2jAdxAEslw5r9ey-WhHOkz8aO2YhM0NP09XrtV/pub?gid=0&single=true&output=csv";
        const BANK_NAMES = { 'A': '招式效果順序', 'B': '「消除」效果' };

        // Auth Logic
        console.log("⏳ [1] 開始初始化 Firebase 驗證...");
        
        onAuthStateChanged(auth, (user) => {
            console.log("🔍 [2] Auth 狀態偵測觸發，目前狀態：", user ? "已登入" : "未登入");
            
            if (user) {
                state.isAuthReady = true;
                console.log("✅ [3] Logged in anonymously as:", user.uid);
                listenToLeaderboard();
            } else {
                console.log("⚠️ [3] 準備向 Firebase 發送匿名登入請求...");
                signInAnonymously(auth)
                    .then((userCredential) => {
                        console.log("✅ [4] 匿名登入 API 呼叫成功！配發 ID:", userCredential.user.uid);
                    })
                    .catch(err => {
                        console.error("❌ [4] 匿名登入失敗！錯誤碼:", err.code);
                        console.error("詳細錯誤訊息:", err.message);
                        alert("Firebase 驗證失敗: " + err.message);
                    });
            }
        });

        // Initialize App
        async function initApp() {
            showView('loading');
            const [resultA, resultB] = await Promise.allSettled([
                fetch(CSV_URL_A).then(r => { if (!r.ok) throw new Error('Network error'); return r.text(); }),
                fetch(CSV_URL_B).then(r => { if (!r.ok) throw new Error('Network error'); return r.text(); })
            ]);

            if (resultA.status === 'fulfilled') {
                state.questionsA = parseData(resultA.value);
            }
            if (resultB.status === 'fulfilled') {
                state.questionsB = parseData(resultB.value);
            }

            state.questionMap = {};
            [...state.questionsA, ...state.questionsB].forEach(q => {
                if (q.id) state.questionMap[q.id] = q;
            });

            try {
                const statsSnap = await getDocs(collection(db, "question_stats"));
                statsSnap.forEach(d => { state.questionStats[d.id] = d.data(); });
            } catch (e) {
                console.warn("無法載入題目統計資料：", e);
            }

            const activeA = state.questionsA.filter(q => q.isActive).length;
            const activeB = state.questionsB.filter(q => q.isActive).length;

            if (activeA === 0 && activeB === 0) {
                showError("無法從 Google 試算表載入題庫，請檢查發布設定。");
                return;
            }

            const btnA = document.getElementById('bank-btn-A');
            const btnB = document.getElementById('bank-btn-B');
            if (activeA === 0) {
                btnA.disabled = true;
                btnA.classList.add('opacity-50', 'cursor-not-allowed');
            }
            if (activeB === 0) {
                btnB.disabled = true;
                btnB.classList.add('opacity-50', 'cursor-not-allowed');
            }

            document.getElementById('total-q-num').textContent = activeA;
            const defaultBank = activeA > 0 ? 'A' : 'B';
            selectBank(defaultBank);
            showView('start');
        }

        function showView(viewName) {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[viewName].classList.remove('hidden');
            document.body.classList.toggle('quiz-active', viewName === 'quiz');
        }

        function showError(msg) {
            document.getElementById('error-message').textContent = msg;
            showView('error');
        }

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        function parseData(csvText) {
            const rawData = parseCSV(csvText);
            if (rawData.length < 2) return [];

            const headers = rawData[0].map(h => h.trim().toLowerCase());
            const colMap = { options: [], images: [] };

            headers.forEach((h, idx) => {
                if (h === 'id') colMap.id = idx;
                else if (h === '狀態' || h === 'status') colMap.status = idx;
                else if (h.includes('題') || h === 'question') colMap.title = idx;
                else if (h.includes('圖') || h === 'image') colMap.images.push(idx);
                else if (h.includes('答案') || h === 'answer') colMap.answer = idx;
                else if (h.includes('解') || h === 'explanation') colMap.explanation = idx;
                else if (h.includes('選') || h.includes('option')) colMap.options.push(idx);
            });

            if (colMap.title === undefined) colMap.title = 0;
            if (colMap.images.length === 0) colMap.images = [1];
            if (colMap.options.length === 0) colMap.options = [2, 3];
            if (colMap.answer === undefined) colMap.answer = 4;
            if (colMap.explanation === undefined) colMap.explanation = 5;

            const questions = [];
            for (let i = 1; i < rawData.length; i++) {
                const row = rawData[i];
                if (!row || !row[colMap.title]) continue;

                const opts = [];
                colMap.options.forEach(idx => {
                    if (row[idx] && row[idx].trim()) opts.push(row[idx].trim());
                });

                const rawAns = row[colMap.answer] ? row[colMap.answer].toString().trim() : "";
                let correctAnswers = rawAns.split(/[,\u3001]/).map(s => s.trim()).filter(s => s !== "");
                
                correctAnswers = correctAnswers.map(ans => {
                    if (/^\d+$/.test(ans)) {
                        let idx = parseInt(ans) - 1;
                        if (idx >= 0 && idx < opts.length) return opts[idx];
                    }
                    return ans;
                });

                const imgs = [];
                colMap.images.forEach(idx => {
                    if (row[idx] && row[idx].trim()) imgs.push(row[idx].trim());
                });

                const rawStatus = colMap.status !== undefined ? (row[colMap.status] || '').trim() : '';

                questions.push({
                    id: colMap.id !== undefined ? (row[colMap.id] || '').trim() : '',
                    isActive: rawStatus !== '無效',
                    title: row[colMap.title].trim(),
                    images: imgs,
                    options: opts,
                    correctAnswers,
                    isMultiple: correctAnswers.length > 1,
                    explanation: row[colMap.explanation] ? row[colMap.explanation].trim() : "目前無詳解說明。"
                });
            }

            return questions;
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function selectBank(bank) {
            state.currentQuizBank = bank;
            const btnA = document.getElementById('bank-btn-A');
            const btnB = document.getElementById('bank-btn-B');
            if (!btnA || !btnB) return;

            if (bank === 'A') {
                btnA.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                btnA.classList.remove('border-slate-200', 'text-slate-600');
                btnB.classList.add('border-slate-200', 'text-slate-600');
                btnB.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            } else {
                btnB.classList.add('border-blue-500', 'bg-blue-50', 'text-blue-700');
                btnB.classList.remove('border-slate-200', 'text-slate-600');
                btnA.classList.add('border-slate-200', 'text-slate-600');
                btnA.classList.remove('border-blue-500', 'bg-blue-50', 'text-blue-700');
            }

            document.getElementById('count-A').textContent = state.questionsA.filter(q => q.isActive).length;
            document.getElementById('count-B').textContent = state.questionsB.filter(q => q.isActive).length;
            document.getElementById('start-total-q').textContent =
                bank === 'A' ? state.questionsA.filter(q => q.isActive).length : state.questionsB.filter(q => q.isActive).length;
        }

        function startQuiz() {
            const input = document.getElementById('nickname-input').value.trim();
            state.nickname = input || '挑戰者';
            const bankQuestions = state.currentQuizBank === 'A' ? state.questionsA : state.questionsB;
            state.questions = bankQuestions.filter(q => q.isActive);
            shuffleArray(state.questions);
            state.currentIdx = 0;
            state.userAnswers = {};
            state.lastScore = null;
            state.lastTime = null;
            document.getElementById('total-q-num').textContent = state.questions.length;
            document.getElementById('quiz-progress-text').classList.remove('hidden');
            showView('quiz');
            renderQuestion('right');
        }

        function renderQuestion(direction = 'right') {
            const q = state.questions[state.currentIdx];
            const contentScrollEl = document.getElementById('q-content-scroll');
            if (contentScrollEl) contentScrollEl.scrollTop = 0;
            document.getElementById('current-q-num').textContent = state.currentIdx + 1;
            document.getElementById('progress-bar').style.width = `${((state.currentIdx) / state.questions.length) * 100}%`;
            
            document.getElementById('q-title').textContent = q.title;
            const badge = document.getElementById('q-type-badge');
            badge.textContent = q.isMultiple ? '多選題' : '單選題';
            badge.className = q.isMultiple ? 'px-4 py-1.5 text-xs font-bold uppercase tracking-widest rounded-full bg-purple-100 text-purple-700' : 'px-4 py-1.5 text-xs font-bold uppercase tracking-widest rounded-full bg-blue-100 text-blue-700';

            const accuracyBadge = document.getElementById('q-accuracy-badge');
            const stats = state.questionStats[q.id];
            if (stats && stats.attemptCount > 0) {
                const pct = stats.correctCount / stats.attemptCount * 100;
                const colorClass = pct >= 70
                    ? 'text-green-700 bg-green-100'
                    : pct > 40
                        ? 'text-amber-700 bg-amber-100'
                        : 'text-red-700 bg-red-100';
                accuracyBadge.className = `text-xs font-bold px-3 py-1 rounded-full ${colorClass}`;
                accuracyBadge.textContent = `👥 答對率 ${pct.toFixed(2)}%`;
            } else {
                accuracyBadge.className = 'hidden';
            }

            const imgCont = document.getElementById('q-image-container');
            imgCont.innerHTML = '';
            if (q.images.length === 0) {
                imgCont.className = 'mb-8 hidden';
            } else if (q.images.length === 1) {
                const url = q.images[0];
                imgCont.className = 'mb-8 text-center';
                const wrapper = document.createElement('div');
                wrapper.className = 'relative inline-block overflow-hidden rounded-2xl border border-slate-200 bg-white cursor-pointer shadow-sm hover:shadow-lg transition-all hover:ring-2 hover:ring-blue-400 group';
                wrapper.onclick = () => openImageModal(url);
                wrapper.innerHTML = `
                    <img src="${url}" alt="題目圖片" class="h-40 sm:h-56 w-auto object-contain mx-auto" onerror="this.parentElement.parentElement.classList.add('hidden');">
                    <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white opacity-0 group-hover:opacity-100 transition-opacity drop-shadow-md bg-black/30 p-2 rounded-full" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                        </svg>
                    </div>`;
                imgCont.appendChild(wrapper);
            } else {
                imgCont.className = 'mb-8 flex gap-3 overflow-x-auto no-scrollbar pb-2';
                const frag = document.createDocumentFragment();
                q.images.forEach(url => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'relative flex-shrink-0 overflow-hidden rounded-2xl border border-slate-200 bg-white cursor-pointer shadow-sm hover:shadow-lg transition-all hover:ring-2 hover:ring-blue-400 group';
                    wrapper.onclick = () => openImageModal(url);
                    wrapper.innerHTML = `
                        <img src="${url}" alt="卡牌圖片" class="h-40 sm:h-56 w-auto object-contain" onerror="this.parentElement.remove();">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white opacity-0 group-hover:opacity-100 transition-opacity drop-shadow-md bg-black/30 p-2 rounded-full" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                            </svg>
                        </div>`;
                    frag.appendChild(wrapper);
                });
                imgCont.appendChild(frag);
            }

            const optionsDiv = document.getElementById('q-options');
            optionsDiv.innerHTML = '';
            
            const saved = state.userAnswers[state.currentIdx] || [];

            q.options.forEach((opt, idx) => {
                const label = document.createElement('label');
                label.className = "cursor-pointer block group";
                const isChecked = saved.includes(opt);
                
                label.innerHTML = `
                    <input type="${q.isMultiple ? 'checkbox' : 'radio'}" name="quiz_opt" value="${opt.replace(/"/g, '&quot;')}" class="hidden option-input" ${isChecked ? 'checked' : ''}>
                    <div class="option-content p-4 rounded-2xl border-2 border-slate-100 bg-white transition-all group-hover:border-blue-200 flex items-center gap-3">
                        <div class="w-6 h-6 rounded-${q.isMultiple ? 'md' : 'full'} border-2 border-slate-200 flex-shrink-0 flex items-center justify-center transition-colors">
                            <div class="w-2.5 h-2.5 rounded-${q.isMultiple ? 'sm' : 'full'} bg-blue-600 opacity-0 transition-opacity"></div>
                        </div>
                        <span class="text-base font-medium text-slate-700">${opt}</span>
                    </div>
                `;
                
                const input = label.querySelector('input');
                const dot = label.querySelector('.bg-blue-600');
                const box = label.querySelector('.w-6');

                const updateUI = () => {
                    if (input.checked) {
                        dot.classList.remove('opacity-0');
                        box.classList.add('border-blue-600');
                    } else {
                        dot.classList.add('opacity-0');
                        box.classList.remove('border-blue-600');
                    }
                };

                input.addEventListener('change', () => {
                    if (!q.isMultiple) {
                        optionsDiv.querySelectorAll('.w-6').forEach(b => b.classList.remove('border-blue-600'));
                        optionsDiv.querySelectorAll('.bg-blue-600').forEach(d => d.classList.add('opacity-0'));
                    }
                    updateUI();
                    saveAnswer();
                });

                if (isChecked) updateUI();
                optionsDiv.appendChild(label);
            });

            document.getElementById('btn-prev').disabled = state.currentIdx === 0;
            document.getElementById('btn-next').textContent = state.currentIdx === state.questions.length - 1 ? '提交成果' : '下一題';
            document.getElementById('btn-next').className = state.currentIdx === state.questions.length - 1
                ? 'px-8 py-2.5 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50 text-sm'
                : 'px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all active:scale-95 disabled:opacity-50 text-sm';

            const contentInner = document.getElementById('q-content-inner');
            if (contentInner) {
                contentInner.classList.remove('slide-in-right', 'slide-in-left');
                void contentInner.offsetWidth;
                contentInner.classList.add(direction === 'right' ? 'slide-in-right' : 'slide-in-left');
            }
        }

        function saveAnswer() {
            const checked = Array.from(document.querySelectorAll('.option-input:checked')).map(i => i.value);
            state.userAnswers[state.currentIdx] = checked;
        }

        window.prevQuestion = () => {
            if (state.currentIdx > 0) {
                state.currentIdx--;
                renderQuestion('left');
            }
        };

        window.nextQuestion = () => {
            saveAnswer();
            if (state.currentIdx < state.questions.length - 1) {
                state.currentIdx++;
                renderQuestion('right');
            } else {
                finishQuiz();
            }
        };

        async function finishQuiz() {
            showView('loading');
            document.getElementById('quiz-progress-text').classList.add('hidden');

            let correctCount = 0;
            const answers = [];
            const container = document.getElementById('review-container');
            container.innerHTML = '';

            state.questions.forEach((q, idx) => {
                const userAns = state.userAnswers[idx] || [];
                const isCorrect = userAns.length === q.correctAnswers.length && userAns.every(v => q.correctAnswers.includes(v));
                if (isCorrect) correctCount++;
                answers.push({ id: q.id, isCorrect, userAnswers: userAns });

                const card = document.createElement('div');
                card.className = `bg-white rounded-2xl shadow-sm border-l-8 ${isCorrect ? 'border-green-500' : 'border-red-500'} p-6 transition-transform hover:scale-[1.01]`;
                
                // 動態生成詳解區域的卡圖
                let imageSection = '';
                if (q.images.length === 1) {
                    imageSection = `
                    <div class="mb-6 text-center">
                        <div class="relative inline-block overflow-hidden rounded-xl border border-slate-200 bg-white cursor-pointer shadow-sm hover:shadow-md transition-all hover:ring-2 hover:ring-blue-400 group" onclick="openImageModal('${q.images[0]}')">
                            <img src="${q.images[0]}" class="h-32 sm:h-48 w-auto object-contain mx-auto" onerror="this.parentElement.style.display='none'">
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white opacity-0 group-hover:opacity-100 transition-opacity drop-shadow-md bg-black/30 p-1.5 rounded-full" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                                </svg>
                            </div>
                        </div>
                    </div>`;
                } else if (q.images.length > 1) {
                    const imgTags = q.images.map(url => `
                        <div class="relative flex-shrink-0 overflow-hidden rounded-xl border border-slate-200 bg-white cursor-pointer shadow-sm hover:shadow-md transition-all hover:ring-2 hover:ring-blue-400 group" onclick="openImageModal('${url}')">
                            <img src="${url}" class="h-32 sm:h-48 w-auto object-contain" onerror="this.parentElement.remove()">
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition-colors flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white opacity-0 group-hover:opacity-100 transition-opacity drop-shadow-md bg-black/30 p-1.5 rounded-full" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
                                </svg>
                            </div>
                        </div>`).join('');
                    imageSection = `<div class="mb-6 flex gap-3 overflow-x-auto no-scrollbar pb-1">${imgTags}</div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4 gap-2">
                        <h4 class="text-lg font-bold text-slate-800 pr-2">第 ${idx + 1} 題：${q.title}</h4>
                        <span class="px-3 py-1 rounded-full text-xs font-black uppercase shrink-0 ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${isCorrect ? 'Correct' : 'Incorrect'}
                        </span>
                    </div>
                    
                    ${imageSection}
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm mb-6">
                        <div class="p-4 bg-slate-50 rounded-xl border border-slate-100">
                            <p class="text-slate-400 font-bold mb-1">你的回答</p>
                            <p class="font-bold ${isCorrect ? 'text-green-600' : 'text-red-500'}">${userAns.join('、') || '未作答'}</p>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-xl border border-blue-100">
                            <p class="text-blue-400 font-bold mb-1">正確答案</p>
                            <p class="font-bold text-blue-800">${q.correctAnswers.join('、')}</p>
                        </div>
                    </div>
                    <div class="pt-4 border-t border-slate-100">
                        <p class="text-xs font-black text-slate-400 mb-2 uppercase tracking-widest">Rule Explanation / 詳解</p>
                        <p class="text-slate-600 leading-relaxed font-medium">${q.explanation}</p>
                    </div>
                `;
                container.appendChild(card);
            });

            const score = Math.round((correctCount / state.questions.length) * 100);
            const nowTime = Date.now();
            
            state.lastScore = score;
            state.lastTime = nowTime;
            state.lastQuizBank = state.currentQuizBank;
            
            document.getElementById('display-nickname').textContent = state.nickname;
            document.getElementById('result-score').textContent = score;
            document.getElementById('result-correct').textContent = correctCount;
            document.getElementById('result-wrong').textContent = state.questions.length - correctCount;
            
            const circle = document.getElementById('score-circle');
            const circumference = 502.65;
            circle.style.strokeDashoffset = circumference - (score / 100) * circumference;

            state.lastResultCode = null;

            console.log("🏁 準備寫入資料庫... 登入狀態是否就緒：", state.isAuthReady);
            if (state.isAuthReady) {
                try {
                    console.log("☁️ 正在傳送資料至 Firestore...");
                    await addDoc(collection(db, "leaderboard"), {
                        nickname: state.nickname,
                        score: score,
                        correctCount: correctCount,
                        totalQuestions: state.questions.length,
                        timestamp: serverTimestamp(),
                        time: nowTime,
                        quizBank: state.currentQuizBank
                    });
                    console.log("✅ 排行榜寫入成功！");

                    const batch = writeBatch(db);
                    answers.forEach(a => {
                        batch.set(doc(db, "question_stats", a.id), {
                            attemptCount: increment(1),
                            correctCount: increment(a.isCorrect ? 1 : 0)
                        }, { merge: true });
                    });
                    await batch.commit();
                    console.log("✅ 題目統計寫入成功！");

                    const resultData = {
                        nickname: state.nickname,
                        score,
                        correctCount,
                        totalQuestions: state.questions.length,
                        quizBank: state.currentQuizBank,
                        time: nowTime,
                        answers
                    };
                    state.lastResultCode = await generateUniqueCode(resultData);
                    console.log("✅ 答題代碼生成成功：", state.lastResultCode);
                } catch (e) {
                    console.error("❌ 寫入失敗，詳細原因：", e);
                }
            } else {
                console.warn("⚠️ 登入狀態未就緒，跳過寫入雲端。");
            }

            showView('result');
            renderResultCode();
        }

        // Result Code Logic
        const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

        async function generateUniqueCode(data) {
            for (let attempts = 0; attempts < 5; attempts++) {
                const code = Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
                const docRef = doc(db, "results", code);
                let collision = false;
                await runTransaction(db, async (tx) => {
                    const existing = await tx.get(docRef);
                    if (existing.exists()) { collision = true; return; }
                    tx.set(docRef, { ...data, code });
                });
                if (!collision) return code;
            }
            throw new Error("Failed to generate unique code after 5 attempts");
        }

        function renderResultCode() {
            const display = document.getElementById('result-code-display');
            const btn = document.getElementById('btn-copy-code');
            if (state.lastResultCode) {
                display.innerHTML = state.lastResultCode.split('').map(ch =>
                    `<span class="inline-flex items-center justify-center w-10 h-10 bg-white border-2 border-slate-300 rounded-xl text-xl font-black text-slate-800 font-mono">${ch}</span>`
                ).join('');
                btn.classList.remove('hidden');
            } else {
                display.innerHTML = '<p class="text-sm text-red-500 font-bold py-2">代碼生成失敗，請截圖保存結果</p>';
                btn.classList.add('hidden');
            }
        }

        window.copyResultCode = async () => {
            if (!state.lastResultCode) return;
            const btn = document.getElementById('btn-copy-code');
            try {
                await navigator.clipboard.writeText(state.lastResultCode);
                btn.textContent = '已複製！';
                setTimeout(() => { btn.textContent = '複製代碼'; }, 1500);
            } catch {
                btn.textContent = '複製失敗';
                setTimeout(() => { btn.textContent = '複製代碼'; }, 1500);
            }
        };

        // Leaderboard Logic
        function listenToLeaderboard() {
            const lbRef = collection(db, "leaderboard");
            
            onSnapshot(lbRef, (snapshot) => {
                const allData = snapshot.docs.map(doc => doc.data());
                
                allData.sort((a, b) => {
                    if (b.score !== a.score) {
                        return b.score - a.score;
                    }
                    return a.time - b.time;
                });
                
                state.fullSortedData = allData;

                if (!document.getElementById('leaderboard-modal').classList.contains('hidden')) {
                    renderLeaderboardList();
                }
            }, (error) => {
                console.error("❌ 讀取排行榜失敗:", error);
            });
        }

        function getFilteredData() {
            if (!state.fullSortedData) return [];
            if (state.leaderboardFilter === 'all') return state.fullSortedData;
            return state.fullSortedData.filter(e => e.quizBank === state.leaderboardFilter);
        }

        function renderLeaderboardList() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            const filteredData = getFilteredData();

            // Banner: rank scoped to lastQuizBank
            const banner = document.getElementById('current-score-banner');
            if (state.lastScore !== null && state.fullSortedData) {
                banner.classList.remove('hidden');
                document.getElementById('banner-score').textContent = state.lastScore;
                const bannerData = state.lastQuizBank
                    ? state.fullSortedData.filter(e => e.quizBank === state.lastQuizBank)
                    : state.fullSortedData;
                const rankIndex = bannerData.findIndex(e =>
                    e.score === state.lastScore && e.time === state.lastTime
                );
                document.getElementById('banner-rank').textContent = rankIndex !== -1 ? rankIndex + 1 : '-';
            } else {
                banner.classList.add('hidden');
            }

            if (filteredData.length === 0) {
                list.innerHTML = '<div class="text-center py-10 text-slate-400 font-bold">尚無挑戰紀錄</div>';
                document.getElementById('page-info').textContent = '0 / 0';
                document.getElementById('btn-prev-page').disabled = true;
                document.getElementById('btn-next-page').disabled = true;
                return;
            }

            const totalPages = Math.ceil(filteredData.length / state.itemsPerPage);
            if (state.currentPage > totalPages) state.currentPage = totalPages;
            if (state.currentPage < 1) state.currentPage = 1;

            document.getElementById('page-info').textContent = `${state.currentPage} / ${totalPages}`;
            document.getElementById('btn-prev-page').disabled = state.currentPage === 1;
            document.getElementById('btn-next-page').disabled = state.currentPage === totalPages;

            const startIndex = (state.currentPage - 1) * state.itemsPerPage;
            const currentData = filteredData.slice(startIndex, startIndex + state.itemsPerPage);

            currentData.forEach((entry, i) => {
                const actualRank = startIndex + i + 1;
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-4 bg-white rounded-2xl mb-3 shadow-sm border border-slate-100 fade-in";

                let rankStyle = "text-slate-400";
                if (actualRank === 1) rankStyle = "text-yellow-500 scale-125";
                else if (actualRank === 2) rankStyle = "text-slate-300 scale-110";
                else if (actualRank === 3) rankStyle = "text-amber-700";

                const bankName = entry.quizBank ? BANK_NAMES[entry.quizBank] : null;
                const bankBadge = bankName
                    ? `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full mt-0.5 ${entry.quizBank === 'A' ? 'bg-blue-100 text-blue-600' : 'bg-purple-100 text-purple-600'}">${bankName}</span>`
                    : '';

                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="w-8 text-center font-black text-xl ${rankStyle}">${actualRank}</span>
                        <div class="flex flex-col">
                            <span class="font-black text-slate-800 truncate max-w-[120px]">${entry.nickname}</span>
                            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">${new Date(entry.time).toLocaleDateString()}</span>
                            ${bankBadge}
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-black text-blue-600">${entry.score}<span class="text-[10px] ml-1">PTS</span></div>
                        <div class="text-[10px] font-bold text-slate-400 italic">Correct: ${entry.correctCount}/${entry.totalQuestions}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // 分頁按鈕事件
        window.prevPage = () => {
            if (state.currentPage > 1) {
                state.currentPage--;
                renderLeaderboardList();
            }
        };

        window.nextPage = () => {
            const totalPages = Math.ceil(getFilteredData().length / state.itemsPerPage);
            if (state.currentPage < totalPages) {
                state.currentPage++;
                renderLeaderboardList();
            }
        };

        function setTabStyle(activeFilter) {
            ['all', 'A', 'B'].forEach(f => {
                const tab = document.getElementById(`tab-${f}`);
                if (!tab) return;
                if (f === activeFilter) {
                    tab.classList.add('text-blue-600', 'border-blue-600');
                    tab.classList.remove('text-slate-400', 'border-transparent');
                } else {
                    tab.classList.add('text-slate-400', 'border-transparent');
                    tab.classList.remove('text-blue-600', 'border-blue-600');
                }
            });
        }

        window.setLeaderboardFilter = (filter) => {
            state.leaderboardFilter = filter;
            state.currentPage = 1;
            setTabStyle(filter);
            renderLeaderboardList();
        };

        window.openLeaderboard = () => {
            const modal = document.getElementById('leaderboard-modal');
            const card = document.getElementById('leaderboard-card');

            state.currentPage = 1;
            state.leaderboardFilter = 'all';
            setTabStyle('all');
            renderLeaderboardList();
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.replace('opacity-0', 'opacity-100');
                card.classList.replace('scale-90', 'scale-100');
            }, 10);
        };

        window.closeLeaderboard = () => {
            const modal = document.getElementById('leaderboard-modal');
            const card = document.getElementById('leaderboard-card');
            modal.classList.replace('opacity-100', 'opacity-0');
            card.classList.replace('scale-100', 'scale-90');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        // --- 圖片放大縮小邏輯 ---
        window.openImageModal = (src) => {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('enlarged-image');
            img.src = src;
            modal.classList.remove('hidden');
            // 強制重繪以啟用過渡動畫
            void modal.offsetWidth;
            modal.classList.replace('opacity-0', 'opacity-100');
            img.classList.replace('scale-90', 'scale-100');
        };

        window.closeImageModal = () => {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('enlarged-image');
            modal.classList.replace('opacity-100', 'opacity-0');
            img.classList.replace('scale-100', 'scale-90');
            setTimeout(() => modal.classList.add('hidden'), 300);
        };

        window.restartApp = () => {
            shuffleArray(state.questions);
            state.lastScore = null;
            state.lastTime = null;
            showView('start');
            selectBank(state.currentQuizBank);
            window.scrollTo(0, 0);
        };

        // --- 代碼查詢邏輯 ---
        window.openResultLookup = () => {
            document.getElementById('lookup-code-input').value = '';
            document.getElementById('lookup-result-container').innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-4 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <p class="font-bold text-sm">輸入代碼開始查詢</p>
                </div>`;
            showView('lookup');
            window.scrollTo(0, 0);
        };

        window.closeResultLookup = () => {
            showView('start');
            window.scrollTo(0, 0);
        };

        window.lookupResultCode = async () => {
            const input = document.getElementById('lookup-code-input');
            const code = input.value.toUpperCase().trim();
            const resultContainer = document.getElementById('lookup-result-container');
            const btn = document.getElementById('btn-lookup');

            if (!code) {
                resultContainer.innerHTML = '<p class="text-center text-sm text-red-500 font-bold py-8">請輸入代碼</p>';
                return;
            }

            btn.disabled = true;
            btn.textContent = '查詢中...';
            resultContainer.innerHTML = '<div class="flex justify-center py-16"><div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-10 w-10"></div></div>';

            try {
                const docSnap = await getDoc(doc(db, "results", code));
                if (docSnap.exists()) {
                    renderLookupResult(docSnap.data());
                } else {
                    resultContainer.innerHTML = '<p class="text-center text-sm text-red-500 font-bold py-8">找不到此代碼，請確認代碼是否正確</p>';
                }
            } catch (e) {
                resultContainer.innerHTML = '<p class="text-center text-sm text-red-500 font-bold py-8">查詢失敗，請檢查網路連線</p>';
                console.error("查詢失敗：", e);
            } finally {
                btn.disabled = false;
                btn.textContent = '查詢';
            }
        };

        function renderLookupResult(data) {
            const container = document.getElementById('lookup-result-container');
            const bankName = BANK_NAMES[data.quizBank] || data.quizBank || '未知';
            const dateStr = new Date(data.time).toLocaleDateString('zh-TW');

            let html = `
                <div class="p-5 border-b border-slate-100 bg-blue-50">
                    <div class="flex justify-between items-start flex-wrap gap-2">
                        <div>
                            <p class="text-lg font-black text-slate-800">${data.nickname}</p>
                            <p class="text-xs text-slate-500 font-bold mt-0.5">${bankName} ・ ${dateStr}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-2xl font-black text-blue-600">${data.score}<span class="text-xs ml-1">分</span></div>
                            <div class="text-xs text-slate-500 font-bold">答對 ${data.correctCount}/${data.totalQuestions}</div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col gap-4 p-4">`;

            (data.answers || []).forEach((a, idx) => {
                const q = state.questionMap[a.id];
                const borderColor = a.isCorrect ? 'border-green-500' : 'border-red-500';
                const badgeCls = a.isCorrect ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';
                const badgeText = a.isCorrect ? 'Correct' : 'Incorrect';
                const answerColor = a.isCorrect ? 'text-green-600' : 'text-red-500';

                if (!q) {
                    html += `
                        <div class="bg-white rounded-xl border-l-4 border-slate-300 p-4 shadow-sm">
                            <div class="flex justify-between items-start gap-2 mb-3">
                                <p class="text-sm font-bold text-slate-400 leading-snug">第 ${idx + 1} 題（ID: ${a.id}）</p>
                                <div class="flex gap-1 flex-wrap justify-end">
                                    <span class="px-2 py-0.5 rounded-full text-xs font-black uppercase shrink-0 ${badgeCls}">${badgeText}</span>
                                    <span class="px-2 py-0.5 rounded-full text-xs font-black shrink-0 bg-slate-100 text-slate-500">題目已移除</span>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div class="p-2.5 bg-slate-50 rounded-lg">
                                    <p class="text-slate-400 font-bold mb-1">你的回答</p>
                                    <p class="font-bold ${answerColor}">${(a.userAnswers || []).join('、') || '未作答'}</p>
                                </div>
                                <div class="p-2.5 bg-slate-100 rounded-lg">
                                    <p class="text-slate-400 font-bold mb-1">正確答案</p>
                                    <p class="font-bold text-slate-400">（已移除）</p>
                                </div>
                            </div>
                        </div>`;
                } else {
                    const deprecatedBadge = !q.isActive
                        ? `<span class="px-2 py-0.5 rounded-full text-xs font-black shrink-0 bg-amber-100 text-amber-700">已廢棄</span>`
                        : '';

                    let imgSection = '';
                    if (q.images && q.images.length === 1) {
                        imgSection = `<div class="mb-3 text-center"><img src="${q.images[0]}" class="h-24 w-auto object-contain mx-auto rounded-lg border border-slate-200" onerror="this.parentElement.style.display='none'"></div>`;
                    } else if (q.images && q.images.length > 1) {
                        const tags = q.images.map(u => `<img src="${u}" class="h-24 w-auto flex-shrink-0 object-contain rounded-lg border border-slate-200" onerror="this.parentElement.remove()">`).join('');
                        imgSection = `<div class="mb-3 flex gap-2 overflow-x-auto no-scrollbar pb-1">${tags}</div>`;
                    }

                    html += `
                        <div class="bg-white rounded-xl border-l-4 ${borderColor} p-4 shadow-sm">
                            <div class="flex justify-between items-start gap-2 mb-3">
                                <p class="text-sm font-bold text-slate-800 leading-snug">第 ${idx + 1} 題：${q.title}</p>
                                <div class="flex gap-1 flex-wrap justify-end">
                                    <span class="px-2 py-0.5 rounded-full text-xs font-black uppercase shrink-0 ${badgeCls}">${badgeText}</span>
                                    ${deprecatedBadge}
                                </div>
                            </div>
                            ${imgSection}
                            <div class="grid grid-cols-2 gap-2 text-xs mb-3">
                                <div class="p-2.5 bg-slate-50 rounded-lg">
                                    <p class="text-slate-400 font-bold mb-1">你的回答</p>
                                    <p class="font-bold ${answerColor}">${(a.userAnswers || []).join('、') || '未作答'}</p>
                                </div>
                                <div class="p-2.5 bg-blue-50 rounded-lg">
                                    <p class="text-blue-400 font-bold mb-1">正確答案</p>
                                    <p class="font-bold text-blue-800">${(q.correctAnswers || []).join('、')}</p>
                                </div>
                            </div>
                            <div class="pt-2 border-t border-slate-100">
                                <p class="text-xs text-slate-500 leading-relaxed">${q.explanation}</p>
                            </div>
                        </div>`;
                }
            });

            html += '</div>';
            container.innerHTML = html;
        }

        window.startQuiz = startQuiz;
        window.initApp = initApp;
        window.selectBank = selectBank;

        // Run
        initApp();
    </script>
</body>
</html>
